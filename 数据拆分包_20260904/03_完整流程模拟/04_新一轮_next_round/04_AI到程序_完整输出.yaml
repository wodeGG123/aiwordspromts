event_details:
  template_name: "新一轮事件"
  event_id: "M06"
  current_round: 24
  supply_value: 70
  corruption_value: 25
  current_theme: "王座吞下了沿途的胜利"
  current_type: "主线事件"
  scene_name: "魔王大厅"
  steps:
    - narration: "圣路在身后合拢时，魔王大厅的黑石地面逐块亮起。那些光并非来自火焰，而是你们一路留下的战斗痕迹、被破解的账页与被救回的记忆，它们正沿着地缝流向王座。"
    - dialogues:
      - npc: "魔王"
        speech: "你们以为每一次胜利都在削弱我。其实每一次选择，都替这座王座证明了你们愿意付出什么。"
    - narration: "王座两侧的侍卫同时举盾，幽灵莉娜曾说过的警告在星穹法师脑海里补全：腐化并不只吞噬失败，它也会模仿胜利的形状。城门圣路保住了撤退方向，却无法阻止黑潮从旧路涌来。"
    - dialogues:
      - npc: "星穹法师"
        speech: "账本、路标和莉娜的记忆不是三条线，它们一直指向同一个回路。王座正在用我们的来路困住我们。"
      - npc: "熔岩矮人王"
        speech: "那就别沿来路打。盾墙交给我，你们去找让回路闭合的那一块石头。"
    - narration: "冰原战士挡在圣路出口前，花岗岩像鬼将岩翼压进地缝，暂时截断一股黑潮。王座因此露出三处不同的破绽：正面的侍卫阵、魔王话语里回避的运输证据，以及法阵中央缺失的圣心锁位。"
    - dialogues:
      - npc: "魔王"
        speech: "向前一步，你们过去保护的人就会替王座承受这一步。停下，我可以让他们继续相信自己得救了。"
    - narration: "远处传来城墙开裂的震响，圣路光芒正在变暗。你们仍能选择以武力撕开侍卫阵，也能用一路保全的证据逼魔王切断回路；缺少圣心残片，使法阵中央的净化方案此刻无法完成。"
  options:
    - text: "迎着王座黑潮突破侍卫阵"
      id: 1
      template_name: "战斗事件"
      visible: true
      available: true
    - text: "以运输证据逼他切断回路（隐藏检定）"
      id: 2
      template_name: "检定"
      visible: true
      available: true
      check_type: "隐藏检定"
      check_difficulty: 20
    - text: "将圣心残片嵌入法阵（隐藏检定）"
      id: 3
      template_name: "检定"
      visible: true
      available: false
      check_type: "隐藏检定"
