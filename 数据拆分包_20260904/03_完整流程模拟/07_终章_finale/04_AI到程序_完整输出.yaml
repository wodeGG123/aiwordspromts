event_details:
  template_name: "终章"
  content: "王座坍塌后的第一阵风并没有立刻吹散大厅里的灰。你们站在断裂的黑石之间，听见远处城墙上传来迟疑的钟声。那钟声起初只有一下，随后从城门、河畔镇和更远的村庄依次回应，像一条被截断许久的道路重新接上。冰原战士仍守在圣路出口，直到确认黑潮没有再次沿地缝回流，才把沾满石屑的剑放低。花岗岩像鬼收拢岩翼，翼缘留下的裂口证明，最后阻断王座的并非某件凭空出现的神兵，而是你们一路保存下来的线索终于在同一刻发挥了作用。最早在艾德村庄，史莱姆并不是为了粮食而来。你们推倒旧货车封住狭巷，保住了粮仓，也保住了那张没有被混战撕碎的旧井图。村长艾德因此愿意交出森林旧路，粘液核心上的黑纹则让星穹法师第一次看见腐化力量移动的方向。那时谁也不知道，一张潮湿的旧图会在最后成为识破王座回路的第一笔证据；但如果当时只顾追杀怪物，后来的每条路都会更暗一些。幽暗森林里被伪造的路标、莉娜反复破碎的警告、河畔镇提前写下的运货日期，随后一件件接在旧井图之后。猜疑蔓延的旅途中，陌生人的承诺本来很容易被当作陷阱；可村长的信任、猎人马克留下的安全记号和莉娜愿意交出的记忆，使你们没有被每一次怀疑拖回原地。亡魂潮让许多夜晚充满重复的脚步声，熔岩矮人王却记住了真正会改变方向的回响，星穹法师则把那些回响同账页上的日期逐一对齐。到达城门时，你们已经明白，腐化不是一条只会向前蔓延的河，它更像一张会利用恐惧、交易和胜利自行收紧的网。古老法师唤醒墙中圣路时，城门暴露出最残酷的真相：守卫的失败也在给王座供能。你们没有把这条圣路当作无需代价的捷径。冰原战士守住撤退方向，花岗岩像鬼用身体固定将要闭合的墙缝，队伍才得以带着完整证据进入魔王大厅。正因如此，魔王试图把你们过去的胜利变成燃料时，那些经历没有只剩下可以吞噬的力量。旧井图说明回路从何处开始，莉娜的记忆说明它如何重复，河畔账页说明它怎样运输，而圣路则保住了最后一条不受王座控制的方向。最终的战斗仍然危险。熔岩矮人王撞开侍卫盾墙时，黑潮几乎从另一侧淹没队伍；星穹法师只能在不断变化的亮纹中指出一次缺口。冰原战士没有追击退开的敌人，而是守住那道缺口，花岗岩像鬼则把岩翼压进地缝，迫使王座第一次失去回流。魔王败下去时没有发出震动天地的哀号，只是紧握扶手，看着它在掌下化为冷灰。他最后留下的威胁并非全无道理：腐化运输线虽然断裂，被伤害过的村镇仍要花很长时间重建信任。但这一次，代价不再被藏在看不见的账本里。返回村庄的路上，你们带着精炼秘银，也带着比奖励更难整理的证词。村长艾德会知道粮仓得救与王座崩塌之间确实存在一条因果链；猎人马克可以重新标记被伪造的森林道路；莉娜留下的记忆不再只是困住亡魂的回声，而会成为辨认下一处腐化残迹的方法。你们没有让所有伤痕消失，也没有得到一个永远不会再生出黑暗的世界。你们做到的是让选择重新属于做出选择的人，让胜利不再自动成为下一场灾难的燃料。当艾德村庄的清晨照上修好的粮仓门时，黑纹已经从井沟边缘褪去。冰原战士先检查撤退的小路，熔岩矮人王抱怨新木梁不够结实，星穹法师把最后一页账目交给村长，花岗岩像鬼则沉默地站在曾经被黏液堵住的巷口。旅程在这里结束，但被保留下来的记忆、信任和证据仍会继续工作；它们不会替后来的人赢下战斗，却会让他们知道，危险真正从哪里来，又该在什么时候停下无谓的追逐。"
